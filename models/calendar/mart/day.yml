version: 2

models:
  - name: day
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: DATE
      - name: year
        data_type: INTEGER
      - name: month
        data_type: INTEGER
      - name: day
        data_type: INTEGER
      - name: weekday_code
        data_type: INTEGER
      - name: weekday
        data_type: VARCHAR
      - name: is_holiday
        data_type: BOOLEAN
      - name: holiday_name
        data_type: VARCHAR
      - name: is_substitute_holiday
        data_type: BOOLEAN
      - name: is_sat
        data_type: BOOLEAN
      - name: is_sun
        data_type: BOOLEAN
      - name: is_sat_sun
        data_type: BOOLEAN
      - name: is_sat_sun_holiday
        data_type: BOOLEAN
      - name: is_weekday
        data_type: BOOLEAN
      - name: fiscal_year
        data_type: INTEGER
      - name: fiscal_quarter
        data_type: INTEGER
      - name: wareki_era
        data_type: VARCHAR
      - name: wareki_year
        data_type: INTEGER
      - name: wareki_label
        data_type: VARCHAR
